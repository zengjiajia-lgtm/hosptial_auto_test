name: API Automation CI

# 触发条件：当代码推送到 main 分支，或者向 main 分支发起 PR 时触发
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest  # 在 GitHub 提供的 Linux 虚拟机上运行

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # 拉取仓库代码

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # 与你本地开发保持一致
        cache: 'pip'  # 开启 pip 依赖缓存，加速后续运行

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests with pytest
      run: |
        pytest --html=report.html --self-contained-html  # 生成 HTML 报告

    - name: Upload test report
      uses: actions/upload-artifact@v4
      if: always()  # 关键：无论测试是否成功，都上传报告，方便排查
      with:
        name: pytest-html-report
        path: report.html
        retention-days: 30  # 报告在 GitHub 上保留 30 天